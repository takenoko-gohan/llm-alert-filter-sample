[package]
name = "lambda"
version = "0.1.2"
edition = "2021"

[dependencies]
aws_lambda_events = { version = "1.1.2", default-features = false, features = ["cloudwatch_logs"] }
lambda_runtime = "1.1.2"
lambda_http = { version = "1.1.2", features = ["apigw_http"] }
tokio = { version = "1.50.0", default-features = false, features = ["macros", "time"] }
futures-util = "0.3.32"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["auth"] }
serde = { version = "1.0.228", features = ["derive"] }
typed-builder = "0.23.2"
aws-smithy-types = "1.4.7"
aws-sdk-secretsmanager = "1.103.0"
aws-sdk-bedrockruntime = "1.128.0"
aws-sdk-dynamodb = "1.110.0"
aws-config = "1.8.15"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
chrono = "0.4.44"
serde_json = "1.0.149"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.1.9"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
tracing = "0.1.44"
thiserror = "2"
rand = "0.9"
