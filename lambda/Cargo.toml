[package]
name = "lambda"
version = "0.1.2"
edition = "2021"

[dependencies]
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["cloudwatch_logs"] }
lambda_runtime = "1.3.0"
lambda_http = { version = "1.3.0", features = ["apigw_http"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "time"] }
futures-util = "0.3.34"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["auth"] }
serde = { version = "1.0.229", features = ["derive"] }
typed-builder = "0.23.2"
aws-smithy-types = "1.6.2"
aws-sdk-secretsmanager = "1.112.0"
aws-sdk-bedrockruntime = "1.140.0"
aws-sdk-dynamodb = "1.121.0"
aws-config = "1.10.1"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
chrono = "0.4.45"
serde_json = "1.0.151"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1.1.9"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
rand = "0.9"

[dev-dependencies]
aws-smithy-mocks = "0.2.6"
tokio = { version = "1.53.1", features = ["test-util"] }
aws-sdk-dynamodb = { version = "1.121.0", features = ["test-util"] }
aws-sdk-bedrockruntime = { version = "1.140.0", features = ["test-util"] }
aws-sdk-secretsmanager = { version = "1.112.0", features = ["test-util"] }
